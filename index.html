<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 관상 궁합 분석기</title>
    <!-- 폰트: 몽환적이고 전문적인 느낌을 위해 Noto Serif KR 사용 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;700&family=Pretendard:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Noto Serif KR"', 'serif'],
                        sans: ['Pretendard', 'sans-serif'],
                    },
                    colors: {
                        primary: '#1e1b4b', // Deep Indigo
                        accent: '#d97706', // Amber 600
                        gold: '#fcd34d',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0f172a;
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0f172a 70%);
            color: #f8fafc;
        }
        
        /* 사진 업로드 영역 스타일 */
        .photo-upload {
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .photo-upload:hover {
            border-color: #fcd34d;
            box-shadow: 0 0 15px rgba(252, 211, 77, 0.2);
        }
        .photo-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            display: none;
        }
        
        /* 스캐닝 애니메이션 */
        .scan-line {
            position: absolute;
            width: 100%;
            height: 4px;
            background: rgba(252, 211, 77, 0.8);
            box-shadow: 0 0 10px #fcd34d, 0 0 20px #fcd34d;
            top: 0;
            left: 0;
            z-index: 20;
            opacity: 0;
        }
        
        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
        .scanning .scan-line {
            animation: scan 2s linear infinite;
        }
        .scanning .photo-preview {
            filter: contrast(1.2) brightness(1.1) sepia(0.3) hue-rotate(-15deg);
        }

        /* 점수 카운트 업 효과용 */
        @property --num {
            syntax: "<integer>";
            initial-value: 0;
            inherits: false;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 font-sans">

    <div class="max-w-3xl w-full bg-slate-800/50 backdrop-blur-md border border-slate-700 rounded-3xl p-6 md:p-10 shadow-2xl relative overflow-hidden">
        
        <!-- 장식용 배경 요소 -->
        <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-transparent via-gold to-transparent opacity-50"></div>

        <div class="text-center mb-10">
            <h1 class="text-3xl md:text-5xl font-serif font-bold text-transparent bg-clip-text bg-gradient-to-r from-amber-200 to-gold mb-3">
                AI 관상 궁합 분석기
            </h1>
            <p class="text-slate-400 text-sm md:text-base">두 분의 사진을 업로드하면 동양의 관상학과 AI 기술을 융합하여 궁합을 분석해 드립니다.</p>
        </div>

        <!-- 사진 업로드 섹션 -->
        <div class="flex flex-col md:flex-row gap-6 mb-8 justify-center items-center">
            
            <!-- 사람 1 업로드 -->
            <div class="flex flex-col items-center w-full md:w-1/2">
                <h3 class="text-lg font-semibold text-amber-100 mb-3 font-serif">첫 번째 사람</h3>
                <label for="upload-1" class="photo-upload w-48 h-64 border-2 border-dashed border-slate-500 rounded-xl flex flex-col items-center justify-center cursor-pointer bg-slate-900/50 group">
                    <svg class="w-10 h-10 text-slate-500 group-hover:text-gold transition-colors mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    <span class="text-sm text-slate-400 group-hover:text-amber-200">사진 선택 (정면)</span>
                    <img id="preview-1" class="photo-preview rounded-xl" src="" alt="Preview 1">
                    <div class="scan-line"></div>
                </label>
                <input type="file" id="upload-1" accept="image/*" class="hidden" onchange="previewImage(event, 'preview-1')">
            </div>

            <!-- 하트 아이콘 -->
            <div class="hidden md:flex items-center justify-center text-pink-500/50 mt-8">
                <svg class="w-12 h-12" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            </div>

            <!-- 사람 2 업로드 -->
            <div class="flex flex-col items-center w-full md:w-1/2">
                <h3 class="text-lg font-semibold text-amber-100 mb-3 font-serif">두 번째 사람</h3>
                <label for="upload-2" class="photo-upload w-48 h-64 border-2 border-dashed border-slate-500 rounded-xl flex flex-col items-center justify-center cursor-pointer bg-slate-900/50 group">
                    <svg class="w-10 h-10 text-slate-500 group-hover:text-gold transition-colors mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    <span class="text-sm text-slate-400 group-hover:text-amber-200">사진 선택 (정면)</span>
                    <img id="preview-2" class="photo-preview rounded-xl" src="" alt="Preview 2">
                    <div class="scan-line"></div>
                </label>
                <input type="file" id="upload-2" accept="image/*" class="hidden" onchange="previewImage(event, 'preview-2')">
            </div>
        </div>

        <!-- 에러 메시지 영역 -->
        <p id="error-msg" class="text-red-400 text-center text-sm font-semibold mb-4 h-5 opacity-0 transition-opacity">두 사람의 사진을 모두 등록해주세요.</p>

        <!-- 분석 버튼 -->
        <div class="flex justify-center mb-6">
            <button id="analyze-btn" onclick="startAnalysis()" class="px-8 py-4 bg-gradient-to-r from-accent to-yellow-600 hover:from-yellow-600 hover:to-accent text-white font-bold rounded-full shadow-[0_0_15px_rgba(217,119,6,0.5)] transform transition hover:scale-105 active:scale-95 text-lg flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                관상 궁합 분석하기
            </button>
        </div>

        <!-- 분석 중 로딩 바 (초기엔 숨김) -->
        <div id="loading-area" class="hidden flex-col items-center justify-center py-6">
            <div class="w-full max-w-md bg-slate-700 rounded-full h-2 mb-4 overflow-hidden">
                <div id="progress-bar" class="bg-gradient-to-r from-amber-400 to-amber-600 h-2 rounded-full w-0 transition-all duration-300 ease-out"></div>
            </div>
            <p id="loading-text" class="text-amber-200 font-serif animate-pulse text-center">얼굴 윤곽선 추출 중...</p>
        </div>

        <!-- 결과 화면 (초기엔 숨김) -->
        <div id="result-area" class="hidden mt-8 pt-8 border-t border-slate-700/50 animate-[fadeIn_1s_ease-out]">
            <div class="text-center mb-8">
                <h2 class="text-xl text-slate-400 mb-2">두 분의 종합 궁합 점수는</h2>
                <div class="flex justify-center items-end gap-2 text-gold">
                    <span id="score-result" class="text-6xl md:text-7xl font-bold font-serif tabular-nums">0</span>
                    <span class="text-3xl pb-2">점</span>
                </div>
                <p id="score-title" class="text-2xl font-bold mt-4 text-amber-400 font-serif">천생연분</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- 결과 상세 항목 1 -->
                <div class="bg-slate-900/60 p-5 rounded-2xl border border-slate-700/50">
                    <div class="flex items-center gap-3 mb-3 text-amber-200">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                        <h4 class="font-bold text-lg font-serif">눈매의 조화 (안상)</h4>
                    </div>
                    <p id="result-eyes" class="text-slate-300 text-sm leading-relaxed"></p>
                </div>
                
                <!-- 결과 상세 항목 2 -->
                <div class="bg-slate-900/60 p-5 rounded-2xl border border-slate-700/50">
                    <div class="flex items-center gap-3 mb-3 text-amber-200">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <h4 class="font-bold text-lg font-serif">입과 턱 (구상/악상)</h4>
                    </div>
                    <p id="result-mouth" class="text-slate-300 text-sm leading-relaxed"></p>
                </div>

                <!-- 결과 종합 -->
                <div class="bg-slate-900/60 p-5 rounded-2xl border border-slate-700/50 md:col-span-2">
                    <div class="flex items-center gap-3 mb-3 text-amber-200">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.95 11.95 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                        <h4 class="font-bold text-lg font-serif">AI 총평</h4>
                    </div>
                    <p id="result-summary" class="text-slate-300 text-sm leading-relaxed md:text-base"></p>
                </div>
            </div>

            <div class="flex justify-center mt-8">
                <button onclick="resetApp()" class="text-slate-400 hover:text-white transition underline underline-offset-4 text-sm">다시 분석하기</button>
            </div>
        </div>
        
        <p class="text-center text-xs text-slate-500 mt-8">※ 본 서비스는 얼굴 인식 알고리즘을 흉내 낸 엔터테인먼트용 프로그램입니다. 재미로만 즐겨주세요!</p>
    </div>

    <script>
        let img1Uploaded = false;
        let img2Uploaded = false;

        // 이미지 미리보기 처리 함수
        function previewImage(event, previewId) {
            const input = event.target;
            const preview = document.getElementById(previewId);
            const parentLabel = input.previousElementSibling;

            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    
                    // 파일 업로드 상태 업데이트
                    if(previewId === 'preview-1') img1Uploaded = true;
                    if(previewId === 'preview-2') img2Uploaded = true;
                    
                    // 에러 메시지 숨기기
                    document.getElementById('error-msg').style.opacity = '0';
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        // 관상학 텍스트 데이터 (랜덤 조합용)
        const eyeTexts = [
            "한 분의 눈빛이 부드럽고 다른 한 분의 눈매가 뚜렷하여 서로의 부족한 점을 채워주는 음양의 조화가 매우 뛰어납니다.",
            "두 분 모두 맑고 선명한 눈을 가져 서로를 향한 진실된 마음이 보입니다. 소통에 막힘이 없는 상입니다.",
            "눈꼬리의 방향이 서로 비슷한 각도를 이루어, 삶의 가치관과 바라보는 방향이 일치하는 평생의 동반자 상입니다.",
            "눈썹과 눈 사이의 간격(전택궁)이 넓어 두 사람이 함께하면 재물운과 가정의 안정을 크게 이룰 수 있는 상입니다."
        ];

        const mouthTexts = [
            "입술의 두께가 서로 조화롭습니다. 한 사람은 수용적이고 한 사람은 표현력이 좋아 다툼이 적고 평화롭습니다.",
            "입꼬리가 살짝 올라간 형태가 닮아 있어, 함께 있을 때 웃을 일이 많고 긍정적인 에너지를 증폭시키는 관계입니다.",
            "턱의 선(지각)이 견고하여 두 사람이 함께 목표를 세우면 끝까지 밀고 나가는 강한 추진력과 인내심을 보여줍니다.",
            "하관이 서로 안정적으로 맞물리는 형상으로, 노년으로 갈수록 더욱 깊어지는 애정과 재물의 안정을 뜻합니다."
        ];

        const summaryTexts = [
            "관상학적으로 서로가 서로에게 귀인이 되는 형국입니다. 각자의 운기를 상승시켜주는 긍정적인 시너지가 발생하므로, 지금의 관계를 소중히 여긴다면 큰 축복이 따를 것입니다.",
            "두 사람의 얼굴 비율은 오행(五行)이 골고루 섞여 있어 톱니바퀴처럼 잘 맞물립니다. 성격적인 차이가 있더라도 그것이 오히려 서로를 보완하는 강력한 무기가 됩니다.",
            "얼굴의 중심인 코(재백궁)와 이마(관록궁)의 조화가 아름답습니다. 연인이나 부부로는 물론이고, 비즈니스 파트너로서도 훌륭한 성과를 낼 수 있는 강한 결속력을 지녔습니다.",
            "서로 다르게 생긴 듯하지만, 관상학적 에너지의 파동은 완벽히 일치하고 있습니다. 배려와 존중만 더해진다면 평생을 함께할 수 있는 깊은 인연의 상입니다."
        ];

        // 분석 시작 로직
        function startAnalysis() {
            if (!img1Uploaded || !img2Uploaded) {
                document.getElementById('error-msg').style.opacity = '1';
                return;
            }

            // UI 상태 변경 (버튼 숨기고 로딩 바 표시)
            document.getElementById('analyze-btn').classList.add('hidden');
            document.getElementById('error-msg').classList.add('hidden');
            document.getElementById('loading-area').classList.remove('hidden');
            document.getElementById('loading-area').classList.add('flex');

            // 스캐닝 애니메이션 시작
            document.querySelectorAll('.photo-upload').forEach(el => el.classList.add('scanning'));

            const progressBar = document.getElementById('progress-bar');
            const loadingText = document.getElementById('loading-text');
            
            let progress = 0;
            const messages = [
                "얼굴 윤곽선 추출 중...", 
                "이마와 눈매 라인 분석 중...", 
                "코와 입꼬리 각도 계산 중...", 
                "오행(五行) 데이터 매칭 중...",
                "관상학적 궁합 점수 산출 중..."
            ];

            // 진행률 시뮬레이션
            const interval = setInterval(() => {
                progress += Math.random() * 15;
                if (progress > 100) progress = 100;
                
                progressBar.style.width = `${progress}%`;
                
                // 텍스트 변경
                const msgIndex = Math.floor((progress / 100) * messages.length);
                if(msgIndex < messages.length) {
                    loadingText.innerText = messages[msgIndex];
                }

                if (progress === 100) {
                    clearInterval(interval);
                    setTimeout(showResults, 800);
                }
            }, 500);
        }

        // 결과 보여주기 로직
        function showResults() {
            // 로딩 UI 숨기기
            document.getElementById('loading-area').classList.remove('flex');
            document.getElementById('loading-area').classList.add('hidden');
            
            // 스캐닝 애니메이션 종료
            document.querySelectorAll('.photo-upload').forEach(el => el.classList.remove('scanning'));

            // 랜덤 결과 생성 (75 ~ 99 사이의 높은 점수로 재미 위주)
            const score = Math.floor(Math.random() * (99 - 75 + 1)) + 75;
            
            // 텍스트 무작위 선택
            const eyeText = eyeTexts[Math.floor(Math.random() * eyeTexts.length)];
            const mouthText = mouthTexts[Math.floor(Math.random() * mouthTexts.length)];
            const summaryText = summaryTexts[Math.floor(Math.random() * summaryTexts.length)];
            
            // 점수에 따른 타이틀
            let title = "";
            if(score >= 95) title = "천생연분 (天生緣分)";
            else if(score >= 90) title = "찰떡궁합 (기운 상승)";
            else if(score >= 80) title = "상호보완형 (점진적 발전)";
            else title = "노력형 인연 (서로 맞춰가는 재미)";

            // DOM 업데이트
            document.getElementById('result-eyes').innerText = eyeText;
            document.getElementById('result-mouth').innerText = mouthText;
            document.getElementById('result-summary').innerText = summaryText;
            document.getElementById('score-title').innerText = title;

            // 결과 영역 표시
            document.getElementById('result-area').classList.remove('hidden');

            // 점수 애니메이션 (카운트 업)
            animateScore(score);
        }

        // 점수 올라가는 애니메이션
        function animateScore(targetScore) {
            let current = 0;
            const scoreElement = document.getElementById('score-result');
            const step = targetScore / 50; // 50프레임 동안 증가

            const timer = setInterval(() => {
                current += step;
                if (current >= targetScore) {
                    current = targetScore;
                    clearInterval(timer);
                    // 타이머 종료 후 텍스트 강조 효과
                    scoreElement.classList.add('scale-110', 'text-amber-400');
                    setTimeout(() => scoreElement.classList.remove('scale-110'), 300);
                }
                scoreElement.innerText = Math.floor(current);
            }, 30);
        }

        // 초기화 로직
        function resetApp() {
            // 데이터 초기화
            img1Uploaded = false;
            img2Uploaded = false;

            // DOM 초기화
            document.getElementById('upload-1').value = '';
            document.getElementById('upload-2').value = '';
            document.getElementById('preview-1').style.display = 'none';
            document.getElementById('preview-2').style.display = 'none';
            document.getElementById('preview-1').src = '';
            document.getElementById('preview-2').src = '';
            
            document.getElementById('result-area').classList.add('hidden');
            document.getElementById('analyze-btn').classList.remove('hidden');
            document.getElementById('progress-bar').style.width = '0%';
            document.getElementById('score-result').innerText = '0';
        }
    </script>
    <style>
        /* 추가 애니메이션 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
